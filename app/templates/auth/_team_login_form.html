<form method="post" action="{{ url_for('auth.team_login') }}" class="auth-form">
  <label for="name">Team name</label>
  <input id="name" name="name" type="text" autocomplete="username" required autofocus>

  <label for="key">Team key</label>
  <input id="key" name="key" type="password" autocomplete="current-password" required>

  <button type="submit">Authenticate Team</button>
</form>
