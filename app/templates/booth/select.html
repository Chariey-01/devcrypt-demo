{% extends "base.html" %}
{% block title %}Select Booth — DevCrypt{% endblock %}
{% block content %}
<main class="shell booth-select">
  <p class="eyebrow">Employer Response Team &middot; Booth Assignment</p>
  <h1 class="brand-mini">{{ icon('server', 16) }} DevCrypt</h1>
  <h2>{{ icon('crosshair', 18) }} Which node are you running?</h2>
  <form method="post" class="booth-grid">
    {% for mission in missions %}
    <button class="role-card" type="submit" name="mission_id" value="{{ mission.id }}">
      <h3>{{ icon('server', 16) }} {{ mission.title }}</h3>
      <p class="mission-id">{{ icon('hash', 11) }} BOOTH-{{ '%02d'|format(mission.booth_id) }}</p>
    </button>
    {% endfor %}
  </form>
  <form method="post" action="{{ url_for('auth.logout') }}" class="inline-form">
    <button class="ghost" type="submit">{{ icon('unlock', 13) }} Terminate Session</button>
  </form>
</main>
{% endblock %}
