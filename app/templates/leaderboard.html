{% extends "base.html" %}
{% block title %}Leaderboard — DevCrypt{% endblock %}
{% block page_id %}leaderboard{% endblock %}
{% block content %}
<main class="shell leaderboard-shell">
  <header class="topbar">
    <span class="brand-mini">{{ icon('radio-tower', 16) }} DevCrypt</span>
    <span class="pill"><span class="status-dot"></span> Live Leaderboard</span>
    <a class="ghost-link" href="{{ url_for('home') }}">&larr; Home</a>
  </header>
  <div class="grid-toolbar">
    <input type="search" id="leaderboard-search" placeholder="Search teams…">
  </div>
  <section id="leaderboard-table" class="card"></section>
</main>
{% endblock %}
