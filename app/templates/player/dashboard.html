{% extends "base.html" %}
{% block title %}Mission Control — DevCrypt{% endblock %}
{% block page_id %}player{% endblock %}
{% block content %}
<main class="shell player">
  <header class="topbar">
    <span class="brand-mini">{{ icon('terminal', 16) }} DevCrypt</span>
    <span id="team-name" class="pill"></span>
    <span id="team-score" class="pill"></span>
    <span id="team-integrity" class="pill"></span>
    <span id="team-hints" class="pill"></span>
    <form method="post" action="{{ url_for('auth.logout') }}" class="inline-form">
      <button class="ghost" type="submit">{{ icon('unlock', 13) }} Terminate Session</button>
    </form>
  </header>

  <div id="broadcast-banner" class="broadcast hidden"></div>
  <div id="event-banner" class="event-banner hidden"></div>

  <p class="section-heading">{{ icon('hash', 14) }} Cipher Progress</p>
  <section class="cryptogram-board" id="cryptogram-board"></section>

  <section id="mission-panel" class="card"></section>

  <p class="section-heading">{{ icon('file-lock-2', 14) }} Recovered Fragments</p>
  <section class="fragment-rail" id="fragment-rail"></section>

  <div id="finished-panel" class="hidden"></div>
</main>
{% endblock %}
