{% extends "base.html" %}
{% block content %}
<main class="shell portal-shell {% block portal_class %}{% endblock %}">
  <p class="footnote portal-back"><a href="{{ url_for('home') }}">&larr; All portals</a></p>
  <p class="eyebrow">{% block portal_eyebrow %}{% endblock %}</p>
  <h1 class="brand-mini">DevCrypt</h1>
  <h2 class="portal-heading">{% block portal_heading %}{% endblock %}</h2>
  <p class="portal-description">{% block portal_description %}{% endblock %}</p>
  <div class="portal-panel">
    {% block portal_form %}{% endblock %}
  </div>
</main>
{% endblock %}
