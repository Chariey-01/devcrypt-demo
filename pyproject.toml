[project]
name = "devcrypt"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0,<4.0",
    "python-dotenv>=1.0,<2.0",
    "Flask-SQLAlchemy>=3.0,<4.0",
    "Flask-Migrate>=4.0,<5.0",
    "Flask-SocketIO>=5.0,<6.0",
    "gevent>=24.0,<27.0",
    "psycogreen>=1.0,<2.0",
    "Flask-Login>=0.6,<0.7",
    "Flask-Bcrypt>=1.0,<2.0",
    "gunicorn>=22.0,<23.0",
    "psycopg2-binary>=2.9,<3.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# migrations: autogenerated/hand-edited Alembic revisions, not app style. content: hidden/visible
# pytest-mode test fixtures used to grade player submissions -- event content, not app source.
extend-exclude = ["migrations", "content"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501 (line-too-long) excluded: this codebase's convention is long, explanatory "why" comments
# (up to ~400 chars) at the point of non-obvious decisions, not short code lines. Enforcing a
# line-length cap would mean rewrapping hundreds of existing comments for no correctness benefit.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["migrations/", "content/"]

[[tool.mypy.overrides]]
# Flask-SocketIO adds `.sid` to Flask's `request` proxy at runtime; no stub package knows about
# it, so every reference in this file is a false positive against Flask's own Request type.
module = "app.sockets"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
# db.Model is a Flask-SQLAlchemy instance attribute assigned inside SQLAlchemy.__init__ (see
# flask_sqlalchemy/extension.py), not a class-level typed attribute -- mypy can't resolve it as a
# valid base class without a dedicated plugin (none exists for Flask-SQLAlchemy 3.x). Scoped to
# this one file rather than disabled globally, since "name-defined" is otherwise a real, useful
# check everywhere else in the app. "index" is the same root cause one level down: a
# db.relationship() attribute (e.g. self.challenges[0]) resolves to the descriptor type at
# analysis time, not the runtime collection it actually returns on an instance.
module = "app.models"
disable_error_code = ["name-defined", "index"]
