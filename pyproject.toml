[project]
name = "devcrypt"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0,<4.0",
    "Flask-SQLAlchemy>=3.0,<4.0",
    "Flask-Migrate>=4.0,<5.0",
    "Flask-SocketIO>=5.0,<6.0",
    "Flask-Login>=0.6,<0.7",
    "Flask-Bcrypt>=1.0,<2.0",
    "gunicorn>=22.0,<23.0",
    "psycopg2-binary>=2.9,<3.0",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "run:app"
