[pytest]
pythonpath = .
# Without this, pytest's default *_test.py discovery pattern also scoops up the pytest-mode
# grading content under content/challenges/ (e.g. booth6_tbm_test.py) and tries to collect them
# as real test modules -- they're not, they're hidden test files GradingEngine runs in its own
# sandbox against a player's submission, and fail to even import outside that context (no
# `submission` module present). Restricting discovery to tests/ is the standard fix.
testpaths = tests
