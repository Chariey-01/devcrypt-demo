services:
  - type: web
    name: devcrypt
    runtime: python
    plan: starter # paid, always-on. Do NOT use "free" — it sleeps after ~15min idle (see DEPLOYMENT.md).
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k gevent -w 1 -b 0.0.0.0:$PORT --timeout 60 --graceful-timeout 60 "app:create_app()"
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: EVENT_SALT
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: devcrypt-db
          property: connectionString
      - key: ALLOWED_ORIGIN
        sync: false # set manually after first deploy, once Render assigns the service's URL

databases:
  - name: devcrypt-db
    plan: starter
    databaseName: devcrypt
    user: devcrypt
